# 量潮数字资产云 — 代码契约
# 模块定位：编程规范、依赖管理、调用关系、质量门禁

# ── 编程规范 ──────────────────────────────────────────

standards:
  studio:
    language: dart
    style: effective_dart
    analyzer: flutter analyze
    formatter: dart format

  provider:
    language: go
    style: effective_go
    linter: go vet
    formatter: gofmt

  cli:
    language: rust
    style: rustfmt
    linter: clippy
    formatter: rustfmt

# ── 模块依赖 ──────────────────────────────────────────

dependencies:
  studio:
    framework: flutter 3.24.5
    state_management: riverpod
    routing: go_router

  provider:
    framework: net/http
    runtime: go 1.25
    cloud_sdk:
      - aliyun-oss-go-sdk

  cli:
    runtime: cargo + rust 1.75
    cli_framework: clap

# ── 调用关系 ──────────────────────────────────────────

call_graph:
  studio → provider: HTTP REST API
  cli → provider: HTTP REST API
  provider → aliyun: FC, OSS, VPC

# ── 质量门禁 ──────────────────────────────────────────

quality:
  tests:
    studio: flutter test
    provider: go test ./...
    cli: cargo test

  coverage_min: 80

  blocked_on_fail: true
