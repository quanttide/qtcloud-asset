<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资产结构 · 资产智能体协作壳</title>
    <script src="data.js"></script>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #282840;
            --text: #cdd6f4;
            --subtle: #a6adc8;
            --border: #45475a;
            --accent: #89b4fa;
            --green: #a6e3a1;
            --font: system-ui, -apple-system, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--text); font-family: var(--font);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .topbar {
            display: flex; align-items: center; padding: 8px 16px;
            background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .topbar .title { font-weight: 700; font-size: 15px; margin-right: 20px; }
        .topbar a { color: var(--accent); font-size: 13px; margin-left: auto; text-decoration: none; }
        .topbar a:hover { text-decoration: underline; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .left-panel {
            width: 100%; background: var(--surface);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .panel-header {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            font-weight: 600; font-size: 13px; color: var(--subtle);
        }
        .tree-container { flex: 1; overflow-y: auto; padding: 8px 0; }
        .tree-node {
            font-size: 13px; line-height: 2; white-space: nowrap; padding: 0 12px;
            cursor: pointer; transition: background 0.15s; display: flex; align-items: center; position: relative;
        }
        .tree-node:hover { background: #363652; }
        .node-icon { margin-right: 6px; font-size: 14px; width: 18px; text-align: center; }
        .node-label { flex: 1; }
        .agent-badge {
            font-size: 10px; background: #45475a; color: var(--accent);
            padding: 1px 6px; border-radius: 4px; margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="topbar">
    <span class="title">📁 资产结构</span>
    <a href="evolution.html">⏳ 查看演化 →</a>
</div>

<div class="main">
    <div class="left-panel">
        <div class="panel-header">资产树（目录 · 文件 · 角色）</div>
        <div class="tree-container" id="asset-tree"></div>
    </div>
</div>

<script>
let graphNodes = [];

function getAgentsInDir(dirId) {
    return graphNodes.filter(n => n.group === 'Agent' && n.parent === dirId).map(n => n.id);
}

function buildTreeView() {
    const container = document.getElementById('asset-tree');
    container.innerHTML = '';
    const root = graphNodes.find(n => n.parent === null);
    if (!root) return;
    renderTreeNode(root, container, 0);
}

function renderTreeNode(node, container, level) {
    const div = document.createElement('div');
    div.className = 'tree-node';
    div.style.paddingLeft = (level * 16 + 12) + 'px';
    const icon = node.group === 'Dir' ? '📁' : (node.group === 'Agent' ? '🤖' : '📄');
    const agentsInDir = node.group === 'Dir' ? getAgentsInDir(node.id) : [];
    div.innerHTML = `
        <span class="node-icon">${icon}</span>
        <span class="node-label">${node.label}</span>
        ${node.group === 'Agent' ? '<span class="agent-badge">角色</span>' : ''}
        ${agentsInDir.length > 0 ? `<span class="agent-badge">${agentsInDir.length} 角色</span>` : ''}
    `;
    container.appendChild(div);
    const dirs = graphNodes.filter(n => n.parent === node.id && n.group === 'Dir');
    const files = graphNodes.filter(n => n.parent === node.id && n.group === 'File');
    dirs.forEach(c => renderTreeNode(c, container, level + 1));
    files.forEach(f => renderTreeNode(f, container, level + 1));
}

function loadData() {
    graphNodes = window.graphData.graphNodes;
    buildTreeView();
}

loadData();
</script>
</body>
</html>
