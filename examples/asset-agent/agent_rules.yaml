agents:
  - id: meta-agent
    path: "."
    watch:
      - "roadmap/*.md"
    outputs:
      - "平台/PLAN.md"
      - "roadmap/*.md"

  - id: platform-agent
    path: "平台"
    watch:
      - "平台/PLAN.md"
    outputs:
      - "platform/docs/drd/*.md"
      - "平台/STATUS.md"

  - id: drd-agent
    path: "平台/docs/drd"
    watch:
      - "platform/docs/drd/*.md"
    outputs:
      - "平台/docs/drd/*.md"

  - id: qa-agent
    path: "平台/docs/qa"
    watch:
      - "平台/docs/drd/*.md"
    outputs:
      - "平台/docs/qa/*.md"

  - id: code-agent
    path: "平台/src"
    watch:
      - "平台/docs/drd/*.md"
    outputs:
      - "平台/src/*.ts"

  - id: test-agent
    path: "平台/test"
    watch:
      - "平台/src/*.ts"
    outputs:
      - "平台/test/*.ts"

  - id: config-agent
    path: "平台/config"
    watch:
      - "平台/config/*"

  - id: lib-agent
    path: "库"
    outputs:
      - "库/src/*"

  - id: example-agent
    path: "示例"
