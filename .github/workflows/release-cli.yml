name: CLI Release

on:
  push:
    tags:
      - "cli-v*"

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: src/cli

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WORKING_DIR }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          BINARY="qtcloud-asset${{ matrix.suffix }}"
          ARCHIVE="qtcloud-asset-${{ matrix.target }}${{ matrix.suffix }}.tar.gz"
          cp "target/${{ matrix.target }}/release/$BINARY" "$BINARY"
          tar czf "$ARCHIVE" "$BINARY"
          echo "archive=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtcloud-asset-${{ matrix.target }}
          path: ${{ env.WORKING_DIR }}/${{ env.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate release notes
        run: |
          echo "## 下载" > release-notes.md
          echo "" >> release-notes.md
          for dir in qtcloud-asset-*/; do
            echo "- \`${dir%/}\`" >> release-notes.md
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CLI ${{ github.ref_name }}
          body_path: release-notes.md
          files: qtcloud-asset-*/*
          draft: false
          prerelease: false
