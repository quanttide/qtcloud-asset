name: Build and Push Provider Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-provider.yml"
      - "manifests/docker/Dockerfile.provider"
      - "src/provider/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-provider.yml"
      - "manifests/docker/Dockerfile.provider"
      - "src/provider/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba Cloud Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build provider image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: manifests/docker/Dockerfile.provider
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          sbom: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/quanttide/qtcloud-asset-provider:latest
            registry.cn-hangzhou.aliyuncs.com/quanttide/qtcloud-asset-provider:${{ github.sha }}

      - name: Verify provider image manifest
        if: github.event_name == 'push'
        run: docker buildx imagetools inspect registry.cn-hangzhou.aliyuncs.com/quanttide/qtcloud-asset-provider:latest
