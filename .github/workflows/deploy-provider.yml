name: Deploy Provider Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-provider.yml"
      - "src/provider/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-provider.yml"
      - "src/provider/**"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build provider package
        run: |
          python -m pip install --upgrade pip
          mkdir -p build/provider
          python -m pip install -r src/provider/requirements.txt -t build/provider
          cp -R src/provider/app build/provider/app
          cd build/provider
          zip -r ../qtcloud-asset-provider.zip .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtcloud-asset-provider
          path: build/qtcloud-asset-provider.zip
          retention-days: 3

  deploy:
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: qtcloud-asset-provider
          path: build

      - name: Upload provider package to OSS
        run: |
          curl -L -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip
          unzip -q ossutil.zip
          OSSUTIL="$(find . -type f -name ossutil -perm -111 | head -n 1)"
          "$OSSUTIL" version
          "$OSSUTIL" -i "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" -k "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" -e oss-cn-hangzhou.aliyuncs.com --region cn-hangzhou cp -f build/qtcloud-asset-provider.zip oss://qtcloud-asset-studio/provider/qtcloud-asset-provider.zip
