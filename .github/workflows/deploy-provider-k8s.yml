name: Deploy Provider to Kubernetes

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Provider Image"]
    types: [completed]

env:
  NAMESPACE: qtcloud-asset
  ACR_REGISTRY: crpi-uorshhk4a32pmmio.cn-hangzhou.personal.cr.aliyuncs.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply namespace
        run: kubectl apply -f manifests/k8s/namespace.yaml

      - name: Configure ACR pull secret
        run: |
          kubectl -n "$NAMESPACE" create secret docker-registry acr-pull-secret \
            --docker-server="$ACR_REGISTRY" \
            --docker-username="${{ secrets.ACR_USERNAME }}" \
            --docker-password="${{ secrets.ACR_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure TLS secret
        run: |
          printf '%s' "${{ secrets.API_TLS_CERT }}" > api.asset.quanttide.com.pem
          printf '%s' "${{ secrets.API_TLS_KEY }}" > api.asset.quanttide.com.key
          kubectl -n "$NAMESPACE" create secret tls qtcloud-asset-api-tls \
            --cert=api.asset.quanttide.com.pem \
            --key=api.asset.quanttide.com.key \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy provider
        run: kubectl apply -f manifests/k8s/provider.yaml

      - name: Wait for rollout
        run: kubectl -n "$NAMESPACE" rollout status deployment/qtcloud-asset-provider --timeout=180s

      - name: Show service endpoints
        run: kubectl -n "$NAMESPACE" get pods,svc,ingress -o wide
