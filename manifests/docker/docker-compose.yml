version: "3.8"

# 历史本地参考配置，不属于当前生产发布路径。
services:
  # 客户端 - Flutter Web 应用
  studio:
    build:
      context: ..
      dockerfile: manifests/docker/Dockerfile.studio
    ports:
      - "8080:8080"
    restart: unless-stopped

  # 服务端 - Go Provider（历史参考）
  provider:
    build:
      context: ..
      dockerfile: manifests/docker/Dockerfile.provider
    ports:
      - "9000:9000"
    environment:
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      - OSS_BUCKET=${OSS_BUCKET}
    restart: unless-stopped
